# Full Dataset Training Configuration
# ====================================
# Fresh training from scratch on the complete MIMIC-IV-BHC dataset (~270K samples)
# No sampling limits - using all available data
# Target: 50,000 steps (~20-24 hours) to reach ROUGE-L 0.25+

model:
  vocab_size: 16000
  d_model: 512
  n_mamba_layers: 6
  n_decoder_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.15              # Increased from 0.1 for full dataset
  max_src_len: 4096
  max_tgt_len: 512
  chunk_size: 256
  stride: 192
  n_memory_tokens: 8
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  pad_id: 3
  bos_id: 1
  eos_id: 2
  label_smoothing: 0.15      # Increased from 0.1

data:
  csv_path: data/mimic-iv-bhc.csv
  tokenizer_path: data/tokenizer/spm.model
  max_src_len: 4096
  max_tgt_len: 512
  pad_id: 3
  bos_id: 1
  eos_id: 2
  source_col: input
  target_col: target
  # NO max_train_samples or max_val_samples - using full dataset

training:
  output_dir: outputs/full_run
  checkpoint_dir: checkpoints/full_run
  log_dir: logs/full_run
  
  # Batch settings (RTX 4070 8GB VRAM)
  batch_size: 4
  gradient_accumulation_steps: 4
  # Effective batch size: 16
  
  # Full training on complete dataset
  max_steps: 50000
  warmup_steps: 2000
  
  # Learning rate
  learning_rate: 5.0e-5      # Slightly lower for full dataset training
  weight_decay: 0.03         # Increased for regularization
  max_grad_norm: 1.0
  label_smoothing: 0.15
  
  # Evaluation and checkpointing
  eval_steps: 1000           # Every 1000 steps (~45-60 min)
  save_steps: 1000           # Save every 1000 steps
  log_steps: 50              # Log every 50 steps
  
  # Mixed precision training
  use_amp: true
  seed: 42
