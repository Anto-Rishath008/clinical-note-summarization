# ROUGE-L Target Training Configuration
# Continue from best_model.pt in main_run until ROUGE-L >= 0.5
# Training does NOT stop at max_steps; it continues until target is reached.

model:
  vocab_size: 16000
  d_model: 512
  n_mamba_layers: 6
  n_decoder_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_src_len: 4096
  max_tgt_len: 512
  chunk_size: 256
  stride: 192
  n_memory_tokens: 8
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  pad_id: 3
  bos_id: 1
  eos_id: 2
  label_smoothing: 0.1

data:
  csv_path: workspace_mamba_longt5_v1/data/mimic-iv-bhc.csv
  tokenizer_path: workspace_mamba_longt5_v1/data/tokenizer/spm.model
  max_src_len: 4096
  max_tgt_len: 512
  pad_id: 3
  bos_id: 1
  eos_id: 2
  source_col: input
  target_col: target

training:
  output_dir: workspace_mamba_longt5_v1/outputs/rouge_target_run
  checkpoint_dir: workspace_mamba_longt5_v1/checkpoints/rouge_target_run
  log_dir: workspace_mamba_longt5_v1/logs/rouge_target_run
  
  # Batch settings (RTX 4070 8GB VRAM)
  batch_size: 4
  gradient_accumulation_steps: 4
  
  # max_steps is used for scheduler; training continues past this until target is met
  max_steps: 50000
  warmup_steps: 500
  
  # Slightly lower LR for fine-tuning from checkpoint
  learning_rate: 5.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing: 0.1
  
  # Evaluate more frequently to catch target
  eval_steps: 250
  save_steps: 1000
  log_steps: 50
  
  use_amp: true
  seed: 42

# Target-based stopping criteria (used by train_to_target.py)
target:
  rouge_l: 0.5
  # Training stops ONLY when ALL conditions below are satisfied:
  #   1. ROUGE-L >= 0.5
  #   2. Validation loss is not increasing (patience-based)
  #   3. Gradient norm is stable (< 2.0)
  max_loss: 4.0
  max_grad_norm_avg: 2.0
  # Patience: continue N evals after target first reached to confirm stability
  patience_evals: 3
