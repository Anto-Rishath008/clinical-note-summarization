# Mamba-Transformer Hybrid Model Configuration
# For clinical note summarization on Kaggle GPU

model:
  vocab_size: 32000
  d_model: 512
  n_mamba_layers: 6
  n_decoder_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_src_len: 4096
  max_tgt_len: 512
  chunk_size: 256
  stride: 192
  n_memory_tokens: 8
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  pad_id: 3
  bos_id: 1
  eos_id: 2
  label_smoothing: 0.1

data:
  csv_path: ./data/mimic-iv-bhc.csv
  tokenizer_path: ./data/tokenizer/spm.model
  max_src_len: 4096
  max_tgt_len: 512
  pad_id: 3
  bos_id: 1
  eos_id: 2
  source_col: source_text
  target_col: target_text

training:
  output_dir: ./outputs
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 50000
  warmup_steps: 2000
  learning_rate: 5.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing: 0.1
  eval_steps: 500
  save_steps: 500
  log_steps: 50
  use_amp: true
  seed: 42
