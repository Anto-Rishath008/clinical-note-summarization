# Main Training Configuration (Full Training Run)
# Mamba-Transformer Hybrid Model for Clinical Summarization
# Estimated time: ~3-4 hours for 10,000 steps

model:
  # Tokenizer vocab size (16000 tokens)
  vocab_size: 16000
  d_model: 512
  n_mamba_layers: 6
  n_decoder_layers: 6
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  max_src_len: 4096
  max_tgt_len: 512
  chunk_size: 256
  stride: 192
  n_memory_tokens: 8
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2
  pad_id: 3
  bos_id: 1
  eos_id: 2
  label_smoothing: 0.1

data:
  csv_path: workspace_mamba_longt5_v1/data/mimic-iv-bhc.csv
  tokenizer_path: workspace_mamba_longt5_v1/data/tokenizer/spm.model
  max_src_len: 4096
  max_tgt_len: 512
  pad_id: 3
  bos_id: 1
  eos_id: 2
  source_col: input
  target_col: target

training:
  output_dir: workspace_mamba_longt5_v1/outputs/main_run
  checkpoint_dir: workspace_mamba_longt5_v1/checkpoints/main_run
  log_dir: workspace_mamba_longt5_v1/logs/main_run
  
  # Batch settings (RTX 4070 8GB VRAM - verified stable)
  batch_size: 4
  gradient_accumulation_steps: 4
  # Effective batch size: 4 * 4 = 16
  
  # Full training: 10,000 steps (~3-4 hours)
  max_steps: 10000
  warmup_steps: 500
  
  # Learning rate (verified stable, no NaN)
  learning_rate: 1.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  label_smoothing: 0.1
  
  # Evaluation and checkpointing
  # Eval every 500 steps (~8 times during training)
  eval_steps: 500
  # Save checkpoint every 1000 steps
  save_steps: 1000
  # Log metrics every 100 steps
  log_steps: 100
  
  # Mixed precision (AMP fp16) - enabled for speed
  use_amp: true
  seed: 42
