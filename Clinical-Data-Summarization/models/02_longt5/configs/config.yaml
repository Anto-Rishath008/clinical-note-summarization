# Configuration for Simplified LongT5 Model
# Optimized for RTX 4070 (8GB VRAM)
# Solves all Issue #1 requirements

# =============================================================================
# Model Configuration (LongT5-inspired)
# =============================================================================
model:
  # Architecture dimensions
  d_model: 256              # Hidden dimension (smaller for 8GB GPU)
  d_ff: 1024                # Feed-forward dimension (4x d_model)
  num_encoder_layers: 4     # Number of encoder layers
  num_decoder_layers: 4     # Number of decoder layers
  num_heads: 8              # Number of attention heads
  dropout: 0.1              # Dropout rate
  
  # Long-context attention settings
  max_position_embeddings: 4096   # Maximum sequence length
  local_radius: 127               # Local attention window radius
  global_block_size: 16           # Global attention block size
  
  # Training settings
  label_smoothing: 0.1      # Label smoothing for cross-entropy
  tie_word_embeddings: true # Tie encoder/decoder embeddings with lm_head

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Paths (relative to workspace root, parent of longt5_model/)
  train_csv_path: "../data/mimic-iv-bhc.csv"
  val_csv_path: "../data/mimic-iv-bhc.csv"        # Use subset for validation
  csv_path: "../data/mimic-iv-bhc.csv"            # Fallback path
  tokenizer_path: "../artifacts/tokenizer/spm.model"
  
  # Column names in CSV
  source_col: "source_text"     # Column containing clinical notes
  target_col: "target_text"     # Column containing summaries
  
  # Sequence lengths
  max_src_len: 4096           # Maximum source length (full document support!)
  max_tgt_len: 512            # Maximum target/summary length
  
  # Tokenizer settings
  vocab_size: 16000           # SentencePiece vocabulary size
  pad_id: 3                   # <pad> token ID
  bos_id: 1                   # <s> token ID
  eos_id: 2                   # </s> token ID

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # Batch settings
  batch_size: 2                         # Small batch for 8GB GPU
  eval_batch_size: 4                    # Larger batch for evaluation
  gradient_accumulation_steps: 8        # Effective batch = 2 * 8 = 16
  
  # Optimization
  learning_rate: 5.0e-5                 # Initial learning rate
  weight_decay: 0.01                    # AdamW weight decay
  max_grad_norm: 1.0                    # Gradient clipping
  warmup_steps: 500                     # LR warmup steps
  scheduler: "linear_warmup_cosine"     # LR scheduler type
  
  # Training duration
  num_epochs: 10                        # Number of training epochs
  steps_per_epoch: 1000                 # Steps per epoch (for streaming)
  
  # Mixed precision (device-agnostic - solves Issue #1)
  fp16: true                            # Enable FP16 training on GPU
  
  # Checkpointing
  checkpoint_dir: "../artifacts/checkpoints/longt5"
  log_dir: "../artifacts/logs/longt5"
  save_interval: 500                    # Save checkpoint every N steps
  eval_interval: 1000                   # Evaluate every N steps
  keep_checkpoints: 3                   # Keep last N checkpoints
  
  # Logging
  log_interval: 50                      # Log metrics every N steps
  
  # Data loading (solves Issue #1: CPU utilization)
  # num_workers is automatically calculated as max(1, int(cpu_count * 0.8))
  streaming: true                       # Use streaming data loader
  
  # Early stopping
  early_stopping_patience: 5            # Stop if no improvement for N epochs
  
# =============================================================================
# Generation Configuration
# =============================================================================
generation:
  max_length: 512              # Maximum summary length
  min_length: 50               # Minimum summary length
  num_beams: 4                 # Beam search width
  length_penalty: 1.0          # Length penalty (>1 = longer, <1 = shorter)
  no_repeat_ngram_size: 3      # Prevent n-gram repetition
  early_stopping: true         # Stop when all beams finished

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  metrics:
    - "rouge1"
    - "rouge2"
    - "rougeL"
  num_samples: 100             # Number of samples for quick evaluation
  batch_size: 4                # Batch size for generation

# =============================================================================
# Notes on Issue #1 Solutions
# =============================================================================
# This configuration addresses all Issue #1 requirements:
#
# 1. Architecture Upgrade:
#    - Uses LongT5-inspired architecture (src/longt5_model.py)
#    - Native 4096 token support with local-global attention
#    - No more LSTM/chunked encoder issues
#
# 2. OOM Fix:
#    - Streaming data loader (no full dataset in memory)
#    - Small batch size with gradient accumulation
#    - Mixed precision training
#
# 3. Device-agnostic GradScaler:
#    - GradScaler(enabled=config['training']['fp16'])
#    - Automatically disabled on CPU
#
# 4. CPU Utilization:
#    - Dynamic num_workers = max(1, int(os.cpu_count() * 0.8))
#
# 5. Multi-GPU Support:
#    - Automatic DataParallel wrapping if multiple GPUs detected
#
# 6. Restart-safe Checkpointing:
#    - Saves all RNG states (Python, NumPy, PyTorch, CUDA)
#    - Saves optimizer, scheduler, and scaler states
#
# 7. Config Cleanup:
#    - No obsolete LSTM parameters (emb_dim, hidden_dim, etc.)
#    - Clean, well-documented configuration
